# main 설치본 → Release zip 동기화 (수동 실행)
name: Sync Release from main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack binaries from origin/main
        shell: pwsh
        run: |
          git fetch origin main
          git worktree add wt origin/main
          $files = Get-ChildItem wt -File | Where-Object {
            $_.Extension -in '.exe','.dll','.json','.config'
          }
          Compress-Archive -Path ($files.FullName) -DestinationPath VArchiveHelper-win.zip -Force
          git worktree remove wt --force

      - name: Upload to Release v0.1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          files: VArchiveHelper-win.zip
          fail_on_unmatched_files: true
